[project]
name = "azure-dashboard-rw5"
version = "0.1.0"
description = "RW5 Azure-backed dashboard: FastAPI backend + static JS frontend."
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "python-dotenv",
    "azure-storage-blob",
    "fastapi",
    "uvicorn[standard]",
    "entsoe-py",
    "openpyxl",
    "influxdb-client",
]

[project.optional-dependencies]
test = [
    "httpx2>=2.9.1",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
